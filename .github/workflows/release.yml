name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instal dependensi
        run: bun install --frozen-lockfile

      - name: Test sebelum rilis
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run test:rust

      # Catatan rilis diambil dari bagian versi ini di CHANGELOG.md (tampil juga di halaman Rilis situs).
      - name: Siapkan catatan rilis
        id: catatan
        shell: bash
        run: |
          versi="${GITHUB_REF_NAME#v}"
          isi="$(awk -v v="## ${versi}" '$0 == v {ambil=1; next} /^## / && ambil {exit} ambil' CHANGELOG.md)"
          {
            echo 'isi<<CATATAN_AKHIR'
            echo "${isi}"
            echo ''
            echo '---'
            echo 'Unduh **Installer .exe** (disarankan) atau paket **.msi** di bawah. Installer dibangun otomatis oleh GitHub Actions dari kode sumber repo ini dan belum ditandatangani, sehingga Windows SmartScreen akan menampilkan peringatan saat pemasangan pertama: pilih "Info lainnya", lalu "Tetap jalankan".'
            echo 'CATATAN_AKHIR'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Ceklis SD ${{ github.ref_name }}
          releaseBody: ${{ steps.catatan.outputs.isi }}
          releaseDraft: false
          prerelease: false
