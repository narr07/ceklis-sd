name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instal dependensi
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test frontend
        run: bun run test

      # Tauri membutuhkan hasil frontend saat compile.
      - name: Build frontend desktop
        run: bun run generate:desktop

      - name: Clippy
        run: bun run clippy

      - name: Test Rust
        run: bun run test:rust
