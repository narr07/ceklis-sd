[package]
name = "ceklis-sd"
version = "1.4.0"
description = "Checklist & template administrasi Sekolah Dasar (Web & Desktop Offline)."
authors = ["Dinar Permadi Yusup"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ceklis_sd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = "=1.8.7"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "=2.8.1"
# Akses langsung ke WebView2 (versi sama dengan yang dipakai Tauri/wry) untuk membuat PDF.
webview2-com = "=0.39.1"
windows = "=0.62.2"
# Google Drive: HTTP (TLS bawaan Windows), token di Credential Manager, enkripsi database.
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "form", "query"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }
argon2 = "=0.5.3"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
